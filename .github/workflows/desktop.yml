name: Desktop test builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Cache native dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare media helper and original samples
        run: npm run prepare:media
      - name: Frontend checks
        run: npm run check
      - name: Native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Native tests
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml
      - name: Prepare signed update configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          printf '{"version":"0.3.%s","bundle":{"createUpdaterArtifacts":true}}' "$GITHUB_RUN_NUMBER" > "$RUNNER_TEMP/elysium-update.json"
      - name: Package signed desktop update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run package -- --config "$RUNNER_TEMP/elysium-update.json"
      - name: Package desktop test app
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run package
      - name: Verify macOS test signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Elysium.app
      - name: Record build commit
        shell: bash
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/build-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Elysium-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/release/bundle/nsis/*.exe*
            artifacts/build-commit.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
      - name: Attach test installers to repository release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Elysium $RELEASE_TAG test release" --notes "Music and video test build. See README for setup, supported features, and current limits. Packages are test-signed or unsigned."
          find installers -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 | xargs -0 -I '{}' gh release upload "$RELEASE_TAG" '{}' --clobber

  publish-updates:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: installers
      - name: Publish signed installers and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: 0.3.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-manifest.mjs installers "$VERSION" "$GH_REPO"
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "Elysium $VERSION" --notes "Prebuilt Elysium update for macOS and Windows."
          find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.exe.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -print0 | xargs -0 gh release upload "v$VERSION"
          gh release upload "v$VERSION" installers/latest.json
          gh release edit "v$VERSION" --draft=false --latest
