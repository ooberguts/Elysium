name: Desktop test builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare media helper and original samples
        run: npm run prepare:media
      - name: Frontend checks
        run: npm run check
      - name: Native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Package desktop app
        run: npm run package
      - name: Verify macOS test signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Elysium.app
      - uses: actions/upload-artifact@v7
        with:
          name: Elysium-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
      - name: Attach test installers to repository release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Elysium $RELEASE_TAG test release" --notes "Music and video test build. See README for setup, supported features, and current limits. Packages are test-signed or unsigned."
          find installers -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 | xargs -0 -I '{}' gh release upload "$RELEASE_TAG" '{}' --clobber
